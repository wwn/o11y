allprojects {
    group = 'ch.nickl.o11y'
    version = '1.0.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(26)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}

tasks.register('dockerRedeployApp', Exec) {
    group = 'docker'
    description = 'Rebuilds and redeploys the "app" profile services (elasticsearch, kibana and filebeat are left running).'
    commandLine 'docker', 'compose', '--profile', 'app', 'up', '-d', '--build'
}
