services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.20
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.20
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.19.20
    user: root
    command: ["-e", "--strict.perms=false"]
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeat-data:/usr/share/filebeat/data
    depends_on:
      - elasticsearch
      - kibana

  london:
    build:
      context: .
      dockerfile: london/Dockerfile
    ports:
      - "49252:49252"
    environment:
      - LONDON_API_URL=http://london:49252
      - FIRENZE_API_URL=http://firenze:49253
      - DRESDEN_API_URL=http://dresden:49254
    labels:
      co.elastic.logs/enabled: "true"

  firenze:
    build:
      context: .
      dockerfile: firenze/Dockerfile
    ports:
      - "49253:49253"
    environment:
      - LONDON_API_URL=http://london:49252
      - FIRENZE_API_URL=http://firenze:49253
      - DRESDEN_API_URL=http://dresden:49254
    labels:
      co.elastic.logs/enabled: "true"

  dresden:
    build:
      context: .
      dockerfile: dresden/Dockerfile
    ports:
      - "49254:49254"
    environment:
      - LONDON_API_URL=http://london:49252
      - FIRENZE_API_URL=http://firenze:49253
      - DRESDEN_API_URL=http://dresden:49254
    labels:
      co.elastic.logs/enabled: "true"

  o11y-app:
    build:
      context: .
      dockerfile: o11y-app/Dockerfile
    ports:
      - "49255:49255"
    environment:
      - LONDON_API_URL=http://london:49252
      - FIRENZE_API_URL=http://firenze:49253
      - DRESDEN_API_URL=http://dresden:49254
    labels:
      co.elastic.logs/enabled: "true"
    depends_on:
      - london
      - firenze
      - dresden

volumes:
  filebeat-data:
