# Keep @QuarkusTest runs self-contained: no background call sequence reaching out to
# firenze/london, and readable plain-text logs instead of ECS JSON.
o11y.app.initial-sequence.enabled=false
quarkus.log.json.console.enabled=false

# Distinct from london's and firenze's test ports so the three modules' @QuarkusTest runs never
# race for the same port when Gradle executes their test tasks concurrently.
quarkus.http.test-port=8091
