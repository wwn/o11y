# Keep @QuarkusTest runs self-contained: no background call sequence reaching out to
# london/dresden, and readable plain-text logs instead of ECS JSON.
o11y.app.initial-sequence.enabled=false
quarkus.log.json.console.enabled=false

# Fix the test port so the firenze-api REST client can point back at this same running
# instance, letting tests exercise a real HTTP self-hop (Firenze calling Firenze). Distinct
# from dresden's and london's test ports so concurrent @QuarkusTest runs never race for it.
quarkus.http.test-port=8093
quarkus.rest-client.firenze-api.url=http://localhost:8093
