filebeat.autodiscover:
  providers:
    - type: docker
      hints.enabled: true
      hints.default_config:
        type: filestream
        id: container-${data.container.id}
        prospector.scanner.symlinks: true
        parsers:
          # 1. unwrap the Docker json-file log envelope
          - container: ~
          # 2. the application line itself is ECS JSON -> merge it to the root
          - ndjson:
              target: ""
              overwrite_keys: true
              add_error_key: true
              expand_keys: true
        paths:
          - /var/lib/docker/containers/${data.container.id}/*.log

processors:
  - add_docker_metadata:
      host: "unix:///var/run/docker.sock"

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]

setup.kibana:
  host: "http://kibana:5601"
